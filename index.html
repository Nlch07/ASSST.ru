<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор темпа | Подсчет скороси бега</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="burger-header">
    <div class="menu-logo">RUN</div>
    <button class="burger-btn" id="burgerBtn">
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
  </div>

  <nav class="menu-items" id="menuItems">
    <div class="ss">Меню</div>
    <div class="menu-item active">Калькулятор темпа</div>
    <div class="menu-item" onclick="location.reload()">Сбросить всё</div>
  </nav>

  <div class="container" id="speedContainer">
    
    <p class="input-hint">Введите время:</p>
    <div class="row time-row">
      <div class="input-group">
        <input id="minutes" type="number" inputmode="numeric" placeholder="00">
        <span class="label">мин</span>
      </div>
      <div class="input-sep">:</div>
      <div class="input-group">
        <input id="seconds" type="number" inputmode="numeric" placeholder="00">
        <span class="label">сек</span>
      </div>
    </div>

    <p class="input-hint" style="margin-top: 15px;">Укажите дистанцию:</p>
    <div class="input-group main-dist">
      <input id="distance" type="number" inputmode="decimal" value="1">
      <button id="unitToggle" class="unit-button">км</button>
    </div>

    <div class="result">
      <div class="res-row">
        <span class="val" id="paceOut">0:00</span>
        <span class="unit">мин/км</span>
      </div>
      <div class="res-row speed-row">
        <span class="val" id="speedOut">0</span>
        <span class="unit">км/ч</span>
      </div>
    </div>

    <div class="reset-action" onclick="resetAll()">Сбросить всё</div>
   
    <div class="stats-grid">
        <div class="stat-box">
            <span class="stat-label">1 км</span>
            <span class="stat-val" id="t1k">0:00</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">5 км</span>
            <span class="stat-val" id="t5k">0:00</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">10 км</span>
            <span class="stat-val" id="t10k">0:00</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">21.1 км</span>
            <span class="stat-val" id="t21k">0:00</span>
        </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
